name: Aggiorna EPG JSON

on:
  schedule:
    - cron: '0 */4 * * *' # Si avvia automaticamente ogni 4 ore
  workflow_dispatch: # Permette anche l'avvio manuale

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Esegui script di generazione EPG
        run: python scripts/gen_epg.py

      - name: Commit e push del file epg.json aggiornato
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add epg.json
          git commit -m "Aggiornamento automatico epg.json" || exit 0
          git push
