<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Il Mio Player IPTV</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; background: #111; color: #fff; font-family: sans-serif; }
    #sidebar { width: 320px; background: #1a1a1a; overflow-y: auto; border-right: 1px solid #333; }
    .item { display: flex; align-items: center; padding: 12px; cursor: pointer; border-bottom: 1px solid #282828; }
    .item:hover { background: #2a2a2a; }
    .item img { width: 40px; height: 40px; object-fit: contain; margin-right: 12px; background: #000; border-radius: 4px; }
    #player-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; }
    video { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="sidebar">
    <div style="padding: 15px; font-weight: bold; background: #222; border-bottom: 1px solid #333;">I miei canali</div>
    <div id="list">Caricamento lista in corso...</div>
  </div>
  <div id="player-container">
    <video id="video" controls autoplay></video>
  </div>
  <script>
  const m3uUrl = "https://raw.githubusercontent.com/mrsoon-1/IPTV/refs/heads/main/tv.m3u";
  const video = document.getElementById('video');
  const listEl = document.getElementById('list');
  let hls = null;

  // Caricamento della playlist
  fetch(m3uUrl)
    .then(r => r.text())
    .then(text => {
      const lines = text.split('\n');
      const channels = [];
      let cur = null;

      lines.forEach(line => {
        line = line.trim();
        if (line.startsWith('#EXTINF:')) {
          const name = line.split(',').pop() || 'Canale';
          const logoMatch = line.match(/tvg-logo="([^"]+)"/);
          cur = { name, logo: logoMatch ? logoMatch[1] : '' };
        } else if (line && !line.startsWith('#')) {
          if (cur) { 
            cur.url = line; 
            channels.push(cur); 
            cur = null; 
          }
        }
      });

      listEl.innerHTML = '';
      channels.forEach(ch => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerHTML = `${ch.logo ? `<img src="${ch.logo}">` : ''}<span>${ch.name}</span>`;
        div.onclick = () => play(ch.url);
        listEl.appendChild(div);
      });
    })
    .catch(() => { listEl.innerText = "Errore nel caricamento della lista."; });

  // Funzione di riproduzione con supporto Proxy CORS per Rai/Mediaset
  function play(rawUrl) {
    // Se il link è un flusso HLS (.m3u8), lo facciamo passare via Proxy per bypassare il blocco CORS
    const proxyUrl = "https://corsproxy.io/?" + encodeURIComponent(rawUrl);

    if (Hls.isSupported()) {
      if (hls) hls.destroy();
      
      hls = new Hls({
        enableWorker: true,
        lowLatencyMode: true
      });

      // Se il flusso è Rai/Mediaset o bloccato, usiamo il proxy, altrimenti proviamo prima l'URL diretto
      const streamToLoad = (rawUrl.includes("rai") || rawUrl.includes("mediaset") || rawUrl.includes("akamaized")) 
        ? proxyUrl 
        : rawUrl;

      hls.loadSource(streamToLoad);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());

      // Gestione errori: se fallisce il link diretto, ritenta automaticamente col proxy
      hls.on(Hls.Events.ERROR, function (event, data) {
        if (data.fatal && data.type === Hls.ErrorTypes.NETWORK_ERROR) {
          console.log("Errore di rete. Tentativo di ripristino tramite Proxy CORS...");
          hls.loadSource(proxyUrl);
          hls.startLoad();
        }
      });

    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = rawUrl;
      video.play();
    }
  }
</script>
</body>
</html>
